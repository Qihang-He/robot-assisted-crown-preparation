# Conda environment for the standalone analysis and validation scripts.
# The Geomagic Wrap scripts (01_geomagic_wrap_scripts/) cannot run in
# this environment: they import geomagic.app.v3 and must be executed inside the Python
# environment bundled with Geomagic Wrap 2021 or later.
#
# Create with:  conda env create -f environment.yml
# Update with:  conda env update -f environment.yml --prune
name: crown-prep-analysis
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.21
  - pandas>=1.3
  - scipy>=1.7
  - matplotlib>=3.4
  - seaborn>=0.11
  - openpyxl>=3.0
  - tqdm>=4.60
  - pip
  - pip:
      - trimesh>=3.9.0
      - shapely>=1.8.0
